name: Validate decision records

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Validate records and published history
        # checkout uses GitHub's test merge. Its first parent is the exact base
        # represented by this checkout; the event payload's base SHA can be older.
        run: |
          git rev-parse --verify HEAD^2 > /dev/null
          base_sha="$(git rev-parse HEAD^1)"
          echo "Validating against checked-out base: $base_sha"
          node scripts/decisions/cli.mjs validate --base "$base_sha"
        env:
          DECISIONS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Our records come from PRs in our fork, also when this runs on the judging PR upstream.
          DECISIONS_REPOSITORY: Tiisetso/northfina-lease-loop
          GH_TOKEN: ${{ github.token }}
